[Application]
app.mainmodule=com.datacube/com.datacube.DataCubeFx

[JavaOptions]
java-options=-Djpackage.app-version=3.0.0
java-options=-Xms16m
java-options=-Xmx256m
java-options=-XX:+UseG1GC
java-options=-XX:MaxHeapFreeRatio=20
java-options=-XX:MinHeapFreeRatio=5
java-options=-XX:G1PeriodicGCInterval=30000
java-options=--enable-native-access=com.datacube
