allprojects {
    layout.buildDirectory.set(file(System.getenv('G11_BUILD') + '/' + (rootProject.name == 'buildSrc' ? 'buildSrc' : 'main')))
    tasks.withType(Test).configureEach {
        systemProperty 'user.home', System.getenv('USERPROFILE')
        systemProperty 'java.io.tmpdir', System.getenv('TEMP')
        systemProperty 'java.awt.headless', System.getenv('G11_HEADLESS')
    }
    afterEvaluate { project ->
        if (rootProject.name != 'buildSrc') {
            def versionOut = layout.buildDirectory.file('generated/version/com/datacube/version.properties').get().asFile
            def brandOut = layout.buildDirectory.dir('generated/brand/com/datacube/fx').get().asFile
            def iconOut = layout.buildDirectory.file('packaging/DataCube.ico').get().asFile
            def standard = file('datacube-brand-assets/assets/icon-mist-violet.png')
            def compact = file('datacube-brand-assets/assets/icon-mist-violet-compact.png')
            def frozenVersion = project.version.toString()
            def icoGenerator = project.buildscript.classLoader.loadClass('datacube.build.IcoGenerator')
            sourceSets.main.resources.setSrcDirs([layout.buildDirectory.dir('generated/version').get().asFile,layout.buildDirectory.dir('generated/brand').get().asFile,file('resources')])
            tasks.named('generateVersionProperties').configure { actions.clear(); doLast { versionOut.parentFile.mkdirs(); versionOut.text = "version=${frozenVersion}\n" } }
            tasks.named('generateBrandIcons').configure { actions.clear(); doLast { icoGenerator.getMethod('writePngs',java.nio.file.Path,java.nio.file.Path,java.nio.file.Path).invoke(null,standard.toPath(),compact.toPath(),brandOut.toPath()) } }
            tasks.named('generateIcon').configure { actions.clear(); doLast { icoGenerator.getMethod('write',java.nio.file.Path,java.nio.file.Path,java.nio.file.Path).invoke(null,standard.toPath(),compact.toPath(),iconOut.toPath()) } }
            jlink { jpackage { icon=iconOut.toString() } }
        }
    }
}
